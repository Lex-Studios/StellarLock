<!doctype html>
<!-- lang/dir are pre-hydration defaults; src/i18n keeps them in sync with the active locale -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-light-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StellarLock" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Geist and Geist Mono fonts are loaded from Google Fonts via a
      dynamically-generated stylesheet. Because Google Fonts CSS is
      generated per user-agent, a static Subresource Integrity (SRI)
      integrity hash cannot be computed for it, so the link is omitted
      here. The CSS custom properties in src/index.css define Geist as
      the preferred family with ui-sans-serif / system-ui fallbacks, so
      the app remains fully functional on system fonts without the
      external request.

      To restore the Geist brand typeface with full SRI coverage, install
      the self-hosted npm package and import in main.tsx:
        npm install geist
        import geist/dist/GeistVF.woff2
        import geist/dist/GeistMonoVF.woff2
    -->
    <title>StellarLock — Token & LP Locks on Stellar</title>
    <meta
      name="description"
      content="Lock tokens and liquidity on Stellar. Prove to your community you haven't rugged with a public, verifiable lock explorer."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
