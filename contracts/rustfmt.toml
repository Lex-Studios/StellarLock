# Pin rustfmt settings so that `cargo fmt --check` does not drift across
# toolchain versions.  All values here are the upstream defaults; listing them
# explicitly makes the formatted output stable regardless of which nightly or
# stable rustfmt binary is used in CI.
edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Auto"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
merge_derives = true
use_try_shorthand = false
force_explicit_abi = true
imports_granularity = "Preserve"
group_imports = "Preserve"
